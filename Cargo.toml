[package]
name = "blackguard"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Blackguard: a beautiful terminal implementation of the solo card game Scoundrel"
authors = ["Elnur Badalov"]
repository = "https://github.com/ElnurBDa/blackguard"
homepage = "https://github.com/ElnurBDa/blackguard"
license = "MIT"
keywords = ["tui", "game", "roguelike", "cards", "scoundrel"]
categories = ["command-line-utilities", "games"]
readme = "README.md"
exclude = [".github/", ".claude/", "flake.nix", "flake.lock", "shell.nix"]
default-run = "blackguard"

[[bin]]
name = "blackguard"
path = "src/main.rs"

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
tui-big-text = "0.7"
tachyonfx = "0.19"
clap = { version = "4", features = ["derive"] }
directories = "6"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
